# Publicación del sitio (no hace falta compilar nada)
[build]
  publish = "."

# El panel no se indexa en buscadores
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Las fotos y los datos se revalidan siempre.
# Antes las fotos se guardaban 7 días en el navegador: si alguien entraba
# justo antes de que subieras una, le quedaba guardado el error y no la veía
# más. Con esto, el navegador pregunta cada vez si hay algo nuevo.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
